site:
  siteURL: https://eljardindeunapedagoga.vercel.app/
  title: El jardin de una pedagoga
  subtitle: LiLi
  lang: es
  translate:
    enable: true
    service: client.edge
    showSelectTag: false
    autoDiscriminate: true
    ignoreClasses:
      - ignore
      - banner-title
      - banner-subtitle
    ignoreTags:
      - script
      - style
      - code
      - pre
  timeZone: 8
  font:
    titles:
      src: >-
        https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=block
      family: Libre Baskerville
    content:
      src: >-
        https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&display=block
      family: Barlow
    adventures:
      src: >-
        https://fonts.googleapis.com/css2?family=Domine:wght@400;700&display=block
      family: Domine
  themeColor:
    hue: 45
  defaultTheme: light
  wallpaper:
    mode: banner
    src:
      desktop:
        - /assets/uploads/1776887267960-cafe-atardcdecer.webp
        - /assets/uploads/1776887285329-mi-jardin.webp
        - /assets/uploads/1776887294701-cascada.webp
      mobile:
        - /assets/uploads/1776887851354-sakura-movil.webp
        - /assets/uploads/1776887865833-japon-movil.webp
        - /assets/uploads/1776887878596-jard-n-movil.webp
    position: center
    carousel:
      enable: true
      interval: 10
      kenBurns: true
    banner:
      homeText:
        enable: true
        title: El jardin de una pedagoga
        subtitle:
          - Life
          - Liberty
          - Grow
        typewriter:
          enable: true
          speed: 111
          deleteSpeed: 51
          pauseTime: 3000
      credit:
        enable: false
        text: Descripción
        url: ''
      navbar:
        transparentMode: semifull
      waves:
        enable: true
        performanceMode: false
    fullscreen:
      zIndex: -1
      opacity: 0.9
      blur: 1
      navbar:
        transparentMode: semi
  loadingOverlay:
    enable: false
    waitForAllResources: true
    title:
      enable: true
      content: CARGANDO
      interval: 1.5
    spinner:
      enable: true
      interval: 1.5
  favicon: []
  generateOgImages: false
navbar:
  links:
    - Home
    - Archive
    - About
sidebar:
  components:
    left:
      - type: profile
        position: top
        visibility:
          mode: exclude
          paths:
            - ^/posts/
            - ^/archive
      - type: toc
        position: sticky
        depth: 3
        visibility:
          mode: include
          paths:
            - ^/posts/
      - type: directory
        position: sticky
      - type: categories
        position: sticky
        responsive:
          collapseThreshold: 5
        depth: 3
      - type: tags
        position: sticky
        responsive:
          collapseThreshold: 20
    right: []
profile:
  avatar: /assets/uploads/1776886053142-el-jardin-de-una-pedagoga.webp
  name: Lili Grow
  bio: |
    Persona | Mamá | Pedagoga 
    (en ese orden) 
  links:
    - name: Instagram
      icon: ''
      url: https://www.instagram.com/eljardindeunapedagoga/
announcement:
  title: Anuncio
  content: ¡Bienvenido a mi blog!
  closable: true
  link:
    enable: true
    text: Saber más
    url: /about/
    external: false
post:
  showLastModified: true
  bookCategories:
    - Las aventuras de Xoshö y Mocho
  expressiveCode:
    theme: github-dark
  license:
    enable: true
    name: CC BY-NC-SA 4.0
    url: https://creativecommons.org/licenses/by-nc-sa/4.0/
  comment:
    enable: false
footer:
  enable: false
particle:
  enable: false
  particleNum: 12
  limitTimes: -1
  size:
    min: 0.3
    max: 0.9
  opacity:
    min: 0.3
    max: 0.9
  speed:
    horizontal:
      min: -0.9
      max: 0.9
    vertical:
      min: 0.15
      max: 0.3
    rotation: 0.12
    fadeSpeed: 0.12
  zIndex: 100
musicPlayer:
  enable: true
  local:
    playlist:
      - id: 1
        title: El Jardín de una Pedagoga
        artist: Lili Grow con ayuda de AI
        cover: /assets/uploads/1778529515538-atardecer-en-mi-jardin.webp
        url: /assets/uploads/1776885621776-Un dia en Tokio.opus
        lrc: ''
        duration: '149'
      - title: Café en Shibuya
        artist: Lili Grow con ayuda de IA
        cover: /assets/uploads/1778529515538-atardecer-en-mi-jardin.webp
        url: /assets/music/1776888290878-cafe-en-shibuya.opus
        lrc: ''
        duration: '181'
      - title: Veranos en Kioto
        artist: Lili Grow con ayuda de IA
        cover: /assets/uploads/1778529515538-atardecer-en-mi-jardin.webp
        url: /assets/music/1776888527595-suenos-de-verano.opus
        lrc: ''
        duration: '158'
  autoplay: true
  fab:
    type: image
    image: /assets/uploads/1778529515538-atardecer-en-mi-jardin.webp
