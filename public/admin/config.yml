# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: ganjimcin/cinblog
  branch: main

media_folder: "public/assets/images"
public_folder: "/assets/images"

collections:
  - name: posts
    label: Posts
    label_singular: Post
    folder: "cin-blog/src/content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Published Date", name: "published", widget: "datetime" }
      - { label: "Updated Date", name: "updated", widget: "datetime", required: false }
      - { label: "Description", name: "description", widget: "string", required: false }
      - { label: "Cover Image", name: "cover", widget: "image", required: false }
      - { label: "Show Cover in Content", name: "coverInContent", widget: "boolean", default: false }
      - { label: "Category", name: "category", widget: "string", required: false }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Language", name: "lang", widget: "string", required: false }
      - { label: "Pinned", name: "pinned", widget: "boolean", default: false }
      - { label: "Author", name: "author", widget: "string", required: false }
      - { label: "Source Link", name: "sourceLink", widget: "string", required: false }
      - { label: "License Name", name: "licenseName", widget: "string", required: false }
      - { label: "License URL", name: "licenseUrl", widget: "string", required: false }
      - { label: "Enable Comments", name: "comment", widget: "boolean", default: true }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Encrypted", name: "encrypted", widget: "boolean", default: false }
      - { label: "Password", name: "password", widget: "string", required: false }
      - { label: "Custom Route Name", name: "routeName", widget: "string", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: pages
    label: Pages
    label_singular: Page
    files:
      - label: "About"
        name: "about"
        file: "cin-blog/src/content/about.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }
      - label: "Friends Page"
        name: "friends"
        file: "cin-blog/src/content/friends.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }
