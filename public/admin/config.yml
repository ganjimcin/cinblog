# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: ganjimcin/cinblog
  branch: main

# Rutas relativas a la raíz del repositorio
media_folder: "public/assets/images"
public_folder: "/assets/images"

collections:
  - name: posts
    label: "Entradas (Posts)"
    label_singular: "Post"
    folder: "src/content/posts"
    extension: "md"
    format: "frontmatter"
    create: true
    nested: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Fecha de Publicación", name: "published", widget: "datetime" }
      - { label: "Fecha de Actualización", name: "updated", widget: "datetime", required: false }
      - { label: "Descripción", name: "description", widget: "string", required: false }
      - {
          label: "Categoría",
          name: "category",
          widget: "select",
          options: ["General", "Tecnología", "Cine", "Proyectos", "Diario", "Examples"],
          default: "General",
        }
      - { label: "Etiquetas", name: "tags", widget: "list", required: false }
      - { label: "Imagen de Portada", name: "cover", widget: "image", required: false }
      - { label: "Mostrar Portada en Contenido", name: "coverInContent", widget: "boolean", default: false }
      - { label: "Fijado (Pinned)", name: "pinned", widget: "boolean", default: false }
      - { label: "Borrador", name: "draft", widget: "boolean", default: false }
      - { label: "Autor", name: "author", widget: "string", required: false }
      - { label: "Cuerpo del Post", name: "body", widget: "markdown" }
      - { label: "Idioma", name: "lang", widget: "string", required: false, placeholder: "es" }
      - { label: "Comentarios Habilitados", name: "comment", widget: "boolean", default: true }

  - name: pages
    label: "Páginas Estáticas"
    files:
      - label: "Sobre mí (About)"
        name: "about"
        file: "src/content/about.md"
        fields:
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Cuerpo", name: "body", widget: "markdown" }
      - label: "Amigos (Friends)"
        name: "friends"
        file: "src/content/friends.md"
        fields:
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Cuerpo", name: "body", widget: "markdown" }

  - name: "projects"
    label: "Proyectos"
    folder: "src/content/projects"
    extension: "json"
    format: "json"
    create: true
    nested: true
    slug: "{{slug}}/intro"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Descripción", name: "description", widget: "text" }
      - { label: "Imagen", name: "image", widget: "image", required: false }
      - {
          label: "Categoría",
          name: "category",
          widget: "select",
          options: ["website", "library", "ai", "software", "game"],
        }
      - { label: "Tecnologías", name: "techStack", widget: "list" }
      - {
          label: "Estado",
          name: "status",
          widget: "select",
          options: ["completed", "in-progress", "planned"],
        }
      - { label: "Demo URL", name: "liveDemo", widget: "string", required: false }
      - { label: "Código Fuente", name: "sourceCode", widget: "string", required: false }
      - { label: "Fecha de Inicio", name: "startDate", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Fecha de Fin", name: "endDate", widget: "datetime", format: "YYYY-MM-DD", required: false }
      - { label: "Destacado", name: "featured", widget: "boolean", default: false }
      - { label: "Etiquetas", name: "tags", widget: "list", required: false }

  - name: "diary"
    label: "Diario"
    folder: "src/content/diary"
    extension: "json"
    format: "json"
    create: true
    nested: true
    slug: "{{slug}}/jsonExample"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Contenido", name: "content", widget: "markdown" }
      - { label: "Fecha", name: "date", widget: "datetime" }
      - { label: "Imágenes", name: "images", widget: "list", field: { widget: "image" } }

  - name: "skills"
    label: "Habilidades (Skills)"
    folder: "src/content/skills"
    extension: "json"
    format: "json"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Nombre", name: "name", widget: "string" }
      - { label: "Descripción", name: "description", widget: "text" }
      - { label: "Icono (Iconify)", name: "icon", widget: "string" }
      - { label: "Nivel", name: "level", widget: "select", options: ["beginner", "intermediate", "advanced", "expert"] }
      - { label: "Categoría", name: "category", widget: "string" }
      - label: "Experiencia"
        name: "experience"
        widget: "object"
        fields:
          - { label: "Años", name: "years", widget: "number", default: 0 }
          - { label: "Meses", name: "months", widget: "number", default: 0 }
      - { label: "Color (HEX)", name: "color", widget: "string" }

  - name: "timeline"
    label: "Línea de Tiempo"
    folder: "src/content/timeline"
    extension: "json"
    format: "json"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Descripción", name: "description", widget: "text" }
      - { label: "Tipo", name: "type", widget: "select", options: ["project", "education", "work", "milestone"] }
      - { label: "Icono", name: "icon", widget: "string" }
      - { label: "Color (HEX)", name: "color", widget: "string" }
      - { label: "Fecha de Inicio", name: "startDate", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Fecha de Fin", name: "endDate", widget: "datetime", format: "YYYY-MM-DD", required: false }
      - { label: "Habilidades Relacionadas", name: "skills", widget: "list" }
      - label: "Enlaces"
        name: "links"
        widget: "list"
        fields:
          - { label: "Nombre", name: "name", widget: "string" }
          - { label: "URL", name: "url", widget: "string" }
          - { label: "Tipo", name: "type", widget: "string" }
      - { label: "Destacado", name: "featured", widget: "boolean", default: false }

  - name: "albums"
    label: "Álbumes"
    folder: "src/content/albums"
    extension: "json"
    format: "json"
    create: true
    nested: true
    slug: "{{slug}}/jsonExample"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Descripción", name: "description", widget: "text" }
      - { label: "Portada (URL/Ruta)", name: "cover", widget: "string" }
      - { label: "Fecha", name: "date", widget: "datetime" }
      - { label: "Ubicación", name: "location", widget: "string", required: false }
      - { label: "Etiquetas", name: "tags", widget: "list", required: false }
      - { label: "Diseño (Layout)", name: "layout", widget: "select", options: ["masonry", "grid"], default: "masonry" }
      - { label: "Columnas", name: "columns", widget: "number", default: 3 }
      - label: "Fotos"
        name: "photos"
        widget: "list"
        fields:
          - { label: "Imagen", name: "src", widget: "image" }
          - { label: "Alt Text", name: "alt", widget: "string" }
          - { label: "Título", name: "title", widget: "string", required: false }
          - { label: "Descripción", name: "description", widget: "text", required: false }
          - { label: "Etiquetas", name: "tags", widget: "list", required: false }
      - { label: "Visible", name: "visible", widget: "boolean", default: true }

  - name: "settings"
    label: "Configuración del Blog"
    delete: false
    editor:
      preview: false
    files:
      - name: "twilight_config"
        label: "Ajustes de Twilight"
        file: "src/twilight.config.yaml"
        fields:
          - label: "Identidad del Sitio"
            name: "site"
            widget: "object"
            fields:
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Subtítulo", name: "subtitle", widget: "string" }
              - { label: "URL del sitio", name: "siteURL", widget: "string" }
              - { label: "Idioma", name: "lang", widget: "string" }
              - { label: "Tema por defecto", name: "defaultTheme", widget: "select", options: ["dark", "light", "system"] }
              - { label: "Color del tema (Hue 0-360)", name: "themeColor", widget: "object", fields: [{ name: "hue", label: "Tono", widget: "number" }] }

          - label: "Perfil"
            name: "profile"
            widget: "object"
            fields:
              - { label: "Nombre", name: "name", widget: "string" }
              - { label: "Biografía", name: "bio", widget: "text" }
              - { label: "Avatar", name: "avatar", widget: "image" }
              - label: "Enlaces Sociales"
                name: "links"
                widget: "list"
                fields:
                  - { label: "Nombre", name: "name", widget: "string" }
                  - { label: "Icono (Iconify)", name: "icon", widget: "string" }
                  - { label: "URL", name: "url", widget: "string" }

          - label: "Wallpaper y Banner"
            name: "site"
            widget: "object"
            fields:
              - label: "Fondo de Pantalla (Wallpaper)"
                name: "wallpaper"
                widget: "object"
                fields:
                  - { label: "Modo", name: "mode", widget: "select", options: ["banner", "fullscreen", "none"] }
                  - label: "Imágenes"
                    name: "src"
                    widget: "object"
                    fields:
                      - { label: "Escritorio (Rutas)", name: "desktop", widget: "list" }
                      - { label: "Móvil (Rutas)", name: "mobile", widget: "list" }
                  - { label: "Posición", name: "position", widget: "select", options: ["top", "center", "bottom"] }
                  - label: "Texto del Banner"
                    name: "banner"
                    widget: "object"
                    fields:
                      - label: "Texto de la Home"
                        name: "homeText"
                        widget: "object"
                        fields:
                          - { label: "Habilitar", name: "enable", widget: "boolean" }
                          - { label: "Título", name: "title", widget: "string" }
                          - { label: "Subtítulo", name: "subtitle", widget: "list" }

          - label: "Anuncios"
            name: "announcement"
            widget: "object"
            fields:
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Contenido", name: "content", widget: "text" }
              - { label: "Cerrable", name: "closable", widget: "boolean" }
              - label: "Enlace"
                name: "link"
                widget: "object"
                fields:
                  - { label: "Habilitar", name: "enable", widget: "boolean" }
                  - { label: "Texto", name: "text", widget: "string" }
                  - { label: "URL", name: "url", widget: "string" }

          - label: "Ajustes de Posts"
            name: "post"
            widget: "object"
            fields:
              - { label: "Mostrar 'Última edición'", name: "showLastModified", widget: "boolean" }
              - label: "Licencia"
                name: "license"
                widget: "object"
                fields:
                  - { label: "Habilitar", name: "enable", widget: "boolean" }
                  - { label: "Nombre", name: "name", widget: "string" }
                  - { label: "URL", name: "url", widget: "string" }

          - label: "Reproductor de Música"
            name: "musicPlayer"
            widget: "object"
            fields:
              - { label: "Habilitar", name: "enable", widget: "boolean" }
              - { label: "Autoreproducir", name: "autoplay", widget: "boolean" }
              - label: "Playlist Local"
                name: "local"
                widget: "object"
                fields:
                  - label: "Canciones"
                    name: "playlist"
                    widget: "list"
                    fields:
                      - { label: "Título", name: "title", widget: "string" }
                      - { label: "Artista", name: "artist", widget: "string" }
                      - { label: "Portada", name: "cover", widget: "image" }
                      - { label: "Archivo de Música", name: "url", widget: "file" }
                      - { label: "Letras (LRC)", name: "lrc", widget: "file", required: false }
                      - { label: "Duración (seg)", name: "duration", widget: "number", required: false }
