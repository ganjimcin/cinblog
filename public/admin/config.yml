# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: ganjimcin/cinblog
  branch: main

# Rutas relativas a la raíz del repositorio
media_folder: "public/assets/images"
public_folder: "/assets/images"

collections:
  - name: posts
    label: "Entradas (Posts)"
    icon: "material-symbols:article-outline"
    label_singular: "Post"
    folder: "src/content/posts"
    extension: "md"
    format: "frontmatter"
    create: true
    nested: false
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Fecha de Publicación", name: "published", widget: "datetime" }
      - { label: "Fecha de Actualización", name: "updated", widget: "datetime", required: false }
      - { label: "Descripción", name: "description", widget: "string", required: false }
      - {
          label: "Categoría",
          name: "category",
          widget: "select",
          options: ["General", "Tecnología", "Cine", "Proyectos", "Diario", "Examples"],
          default: "General",
        }
      - { label: "Etiquetas", name: "tags", widget: "list", required: false }
      - { label: "Imagen de Portada", name: "cover", widget: "image", required: false }
      - { label: "Mostrar Portada en Contenido", name: "coverInContent", widget: "boolean", default: false }
      - { label: "Fijado (Pinned)", name: "pinned", widget: "boolean", default: false }
      - { label: "Borrador", name: "draft", widget: "boolean", default: false }
      - { label: "Autor", name: "author", widget: "string", required: false }
      - { label: "Cuerpo del Post", name: "body", widget: "markdown" }
      - { label: "Idioma", name: "lang", widget: "string", required: false, placeholder: "es" }
      - { label: "Comentarios Habilitados", name: "comment", widget: "boolean", default: true }

  - name: pages
    label: "Páginas Estáticas"
    icon: "material-symbols:description-outline"
    files:
      - label: "Sobre mí (About)"
        name: "about"
        file: "src/content/about.md"
        fields:
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Cuerpo", name: "body", widget: "markdown" }

  - name: "settings"
    label: "Configuración del Blog"
    icon: "material-symbols:settings-outline"
    delete: false
    editor:
      preview: false
    files:
      - name: "twilight_config"
        label: "Ajustes de Twilight"
        file: "src/twilight.config.yaml"
        fields:
          - label: "Identidad del Sitio"
            name: "site"
            widget: "object"
            fields:
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Subtítulo", name: "subtitle", widget: "string" }
              - { label: "URL del sitio", name: "siteURL", widget: "string" }
              - { label: "Idioma", name: "lang", widget: "string" }
              - { label: "Tema por defecto", name: "defaultTheme", widget: "select", options: ["dark", "light", "system"] }
              - { label: "Color del tema (Hue 0-360)", name: "themeColor", widget: "object", fields: [{ name: "hue", label: "Tono", widget: "number" }] }

          - label: "Perfil"
            name: "profile"
            widget: "object"
            fields:
              - { label: "Nombre", name: "name", widget: "string" }
              - { label: "Biografía", name: "bio", widget: "text" }
              - { label: "Avatar", name: "avatar", widget: "image" }
              - label: "Enlaces Sociales"
                name: "links"
                widget: "list"
                fields:
                  - { label: "Nombre", name: "name", widget: "string" }
                  - { label: "Icono (Iconify)", name: "icon", widget: "string" }
                  - { label: "URL", name: "url", widget: "string" }

          - label: "Wallpaper y Banner"
            name: "site"
            widget: "object"
            fields:
              - label: "Fondo de Pantalla (Wallpaper)"
                name: "wallpaper"
                widget: "object"
                fields:
                  - { label: "Modo", name: "mode", widget: "select", options: ["banner", "fullscreen", "none"] }
                  - label: "Imágenes"
                    name: "src"
                    widget: "object"
                    fields:
                      - { label: "Escritorio (Rutas)", name: "desktop", widget: "list", field: { widget: "image" } }
                      - { label: "Móvil (Rutas)", name: "mobile", widget: "list", field: { widget: "image" } }
                  - { label: "Posición", name: "position", widget: "select", options: ["top", "center", "bottom"] }
                  - label: "Texto del Banner"
                    name: "banner"
                    widget: "object"
                    fields:
                      - label: "Texto de la Home"
                        name: "homeText"
                        widget: "object"
                        fields:
                          - { label: "Habilitar", name: "enable", widget: "boolean" }
                          - { label: "Título", name: "title", widget: "string" }
                          - { label: "Subtítulo", name: "subtitle", widget: "list", field: { widget: "string" } }

          - label: "Anuncios"
            name: "announcement"
            widget: "object"
            fields:
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Contenido", name: "content", widget: "text" }
              - { label: "Cerrable", name: "closable", widget: "boolean" }
              - label: "Enlace"
                name: "link"
                widget: "object"
                fields:
                  - { label: "Habilitar", name: "enable", widget: "boolean" }
                  - { label: "Texto", name: "text", widget: "string" }
                  - { label: "URL", name: "url", widget: "string" }

          - label: "Ajustes de Posts"
            name: "post"
            widget: "object"
            fields:
              - { label: "Mostrar 'Última edición'", name: "showLastModified", widget: "boolean" }
              - label: "Licencia"
                name: "license"
                widget: "object"
                fields:
                  - { label: "Habilitar", name: "enable", widget: "boolean" }
                  - { label: "Nombre", name: "name", widget: "string" }
                  - { label: "URL", name: "url", widget: "string" }

          - label: "Reproductor de Música"
            name: "musicPlayer"
            widget: "object"
            fields:
              - { label: "Habilitar", name: "enable", widget: "boolean" }
              - { label: "Autoreproducir", name: "autoplay", widget: "boolean" }
              - label: "Botón Flotante (FAB)"
                name: "fab"
                widget: "object"
                fields:
                  - { label: "Tipo", name: "type", widget: "select", options: ["icon", "image"], default: "icon" }
                  - { label: "Icono", name: "icon", widget: "string", default: "material-symbols:music-note" }
                  - { label: "Imagen", name: "image", widget: "image" }
              - label: "Playlist Local"
                name: "local"
                widget: "object"
                fields:
                  - label: "Canciones"
                    name: "playlist"
                    widget: "list"
                    fields:
                      - { label: "Título", name: "title", widget: "string" }
                      - { label: "Artista", name: "artist", widget: "string" }
                      - { label: "Portada", name: "cover", widget: "image" }
                      - { label: "Archivo de Música", name: "url", widget: "file" }
                      - { label: "Letras (LRC)", name: "lrc", widget: "file", required: false }
                      - { label: "Duración (seg)", name: "duration", widget: "number", required: false }
