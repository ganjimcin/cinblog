# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: ganjimcin/cinblog
  branch: main

media_folder: "cin-blog/public/assets/images"
public_folder: "/assets/images"

collections:
  - name: posts
    label: "Entradas (Posts)"
    label_singular: "Post"
    folder: "cin-blog/src/content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Fecha de Publicación", name: "published", widget: "datetime" }
      - { label: "Fecha de Actualización", name: "updated", widget: "datetime", required: false }
      - { label: "Descripción", name: "description", widget: "string", required: false }
      - { label: "Categoría", name: "category", widget: "select", options: ["General", "Tecnología", "Cine", "Proyectos", "Diario"], default: "General" }
      - { label: "Etiquetas", name: "tags", widget: "list", required: false }
      - { label: "Imagen de Portada", name: "cover", widget: "image", required: false }
      - { label: "Mostrar Portada en Contenido", name: "coverInContent", widget: "boolean", default: false }
      - { label: "Fijado (Pinned)", name: "pinned", widget: "boolean", default: false }
      - { label: "Borrador", name: "draft", widget: "boolean", default: false }
      - { label: "Idioma", name: "lang", widget: "string", required: false, placeholder: "es" }
      - { label: "Autor", name: "author", widget: "string", required: false }
      - { label: "Enlace de Fuente", name: "sourceLink", widget: "string", required: false }
      - { label: "Comentarios Habilitados", name: "comment", widget: "boolean", default: true }
      - { label: "🔒 Encriptado", name: "encrypted", widget: "boolean", default: false }
      - { label: "🔒 Contraseña", name: "password", widget: "string", required: false }
      - { label: "Cuerpo del Post", name: "body", widget: "markdown" }

  - name: pages
    label: "Páginas Estáticas"
    files:
      - label: "Sobre mí (About)"
        name: "about"
        file: "cin-blog/src/content/about.md"
        fields:
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Cuerpo", name: "body", widget: "markdown" }
      - label: "Amigos (Friends)"
        name: "friends"
        file: "cin-blog/src/content/friends.md"
        fields:
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Cuerpo", name: "body", widget: "markdown" }

  - name: other_content
    label: "Otros Contenidos (JSON)"
    files:
      - label: "Proyectos"
        name: "projects"
        file: "cin-blog/src/content/projects/Twilight/intro.json"
        fields:
          - { label: "Contenido JSON", name: "json", widget: "code", default_language: "json" }
      - label: "Habilidades (Skills)"
        name: "skills"
        file: "cin-blog/src/content/skills/astro.json"
        fields:
          - { label: "Contenido JSON", name: "json", widget: "code", default_language: "json" }
